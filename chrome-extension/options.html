<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Team Learning Academy — Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options-body">
    <main class="card">
      <h1>Extension Settings</h1>
      <p class="muted">
        Enter the web address of your Team Learning Academy LMS. This is the
        same URL you use to log in from your browser.
      </p>
      <label for="baseUrl">LMS URL</label>
      <input id="baseUrl" type="url" placeholder="https://learn.example.com" />
      <button id="save">Save</button>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
